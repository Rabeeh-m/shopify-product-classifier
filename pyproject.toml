[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shopify-product-classifier"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
    "Django>=5.1,<5.2",
    "djangorestframework>=3.17,<3.19",
    "django-cors-headers>=4.4,<5.0",
    "python-dotenv>=1.0,<2.0",
    "openpyxl>=3.1,<4.0",
    "google-genai>=1.0,<2.0",
    "rapidfuzz>=3.0,<4.0",
]

[project.optional-dependencies]
dev = [
    "black>=24.0,<27.0",
    "ruff>=0.4,<1.0",
]

[tool.setuptools.packages.find]
include = ["config*", "core*", "products*", "taxonomy*", "classification*"]
exclude = ["frontend*", "tests*", "docs*"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
